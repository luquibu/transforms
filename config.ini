; Configuración de los transforms. Recargá el script (menú de la bandeja) después de editar.
; [general] da los valores por defecto; cada sección de transform puede pisar model, effort y max_tokens.
; hotkey usa la sintaxis de AutoHotkey v2: ^ = Ctrl, ! = Alt, + = Shift, # = Win.

[general]
model=claude-sonnet-5-5
effort=medium
max_tokens=8000
timeout_s=60

[pulir]
hotkey=^!e
prompt=pulir-espanol.md
label=Puliendo

[ingles]
hotkey=^!s
prompt=dictado-a-ingles.md
label=Traduciendo al inglés

[espanol]
hotkey=^!d
prompt=ingles-a-espanol.md
label=Traduciendo al español

[agente]
hotkey=^!a
prompt=pedido-agente.md
label=Armando pedido
